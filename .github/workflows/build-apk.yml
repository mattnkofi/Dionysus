name: Build Dionysus APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies & Build Web App
      run: |
        npm install
        npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Initialize Capacitor Android
      run: |
        npx cap add android
        npx cap sync android

    - name: Configure App Name to Dionysus
      run: |
        node -e '
          const fs = require("fs");
          const path = "android/app/src/main/res/values/strings.xml";
          let xml = fs.readFileSync(path, "utf8");
          xml = xml.replace(/<string name=\"app_name\">[^<]*<\/string>/, "<string name=\"app_name\">Dionysus</string>");
          fs.writeFileSync(path, xml);
        '

    - name: Generate App Icons from logo.png
      run: |
        npm install -D @capacitor/assets
        npx capacitor-assets generate --android --iconPath logo.png

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Dionysus-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk