name: Build Dionysus APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Build Ionic application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Configure App Name to Dionysus
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/res/values/strings.xml";
            if (fs.existsSync(path)) {
              let xml = fs.readFileSync(path, "utf8");
              xml = xml.replace(/<string name=\"app_name\">[^<]*<\/string>/, "<string name=\"app_name\">Dionysus</string>");
              fs.writeFileSync(path, xml);
            }
          '

      - name: Generate App Icons from logo.png
        run: |
          mkdir -p assets
          if [ -f "logo.png" ]; then
            cp logo.png assets/icon.png
          fi
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Make Gradle executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Dionysus.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dionysus-APK
          path: Dionysus.apk
          if-no-files-found: error
          retention-days: 30